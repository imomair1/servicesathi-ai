<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceSathi AI - Operations Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Recharts for Analytics -->
    <script src="https://unpkg.com/recharts/umd/Recharts.js"></script>
    
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .node { transition: all 0.3s ease; }
        .node.active { box-shadow: 0 0 15px 5px rgba(56, 189, 248, 0.5); border-color: #38bdf8; }
        .node.completed { border-color: #10b981; }
        .node.error { border-color: #ef4444; }
        .node.waiting { border-color: #f59e0b; animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = window.Recharts;

        // Custom Hook for WebSocket
        function useWebSocket(url) {
            const [events, setEvents] = useState([]);
            const [wsStatus, setWsStatus] = useState('Connecting...');
            const wsRef = useRef(null);

            useEffect(() => {
                const connect = () => {
                    const ws = new WebSocket(url);
                    
                    ws.onopen = () => {
                        setWsStatus('Connected');
                        console.log('WS Connected');
                    };
                    
                    ws.onmessage = (event) => {
                        const data = JSON.parse(event.data);
                        setEvents(prev => [data, ...prev].slice(0, 50));
                    };
                    
                    ws.onclose = () => {
                        setWsStatus('Disconnected');
                        setTimeout(connect, 3000);
                    };
                    
                    wsRef.current = ws;
                };
                
                connect();
                
                return () => {
                    if (wsRef.current) wsRef.current.close();
                };
            }, [url]);

            return { events, wsStatus };
        }

        const NodeGraph = ({ events }) => {
            // Very simple graph visualization based on latest state
            const latestState = events.find(e => e.type === 'workflow_state')?.data || {};
            const completed = latestState.completed_steps || [];
            const status = latestState.status || 'pending';
            
            const agents = [
                { id: 'intent', name: 'Intent Agent', icon: '🧠' },
                { id: 'context', name: 'Context Agent', icon: '❓', conditional: true },
                { id: 'discovery', name: 'Discovery Agent', icon: '🔍' },
                { id: 'ranking', name: 'Ranking Engine', icon: '📊' },
                { id: 'booking', name: 'Booking Execution', icon: '📋' },
                { id: 'followup', name: 'Follow-Up', icon: '🔔' }
            ];

            return (
                <div className="glass-panel rounded-xl p-6 h-full flex flex-col">
                    <h2 className="text-xl font-bold mb-4 flex items-center">
                        <span className="text-blue-400 mr-2">⎈</span> Orchestration Graph
                    </h2>
                    <div className="flex-1 flex flex-col justify-center space-y-4">
                        {agents.map((agent, i) => {
                            let nodeState = 'pending';
                            if (completed.includes(agent.id) || completed.includes(agent.name.replace(' ', ''))) {
                                nodeState = 'completed';
                            } else if (status === 'running' && !completed.includes(agent.id) && i === completed.length) {
                                nodeState = 'active';
                            } else if (status === 'error' && i === completed.length) {
                                nodeState = 'error';
                            } else if (status === 'waiting_for_user' && agent.id === 'context') {
                                nodeState = 'waiting';
                            }

                            if (agent.conditional && nodeState === 'pending') return null;

                            return (
                                <div key={agent.id} className="relative">
                                    <div className={`node ${nodeState} p-4 rounded-lg border-2 border-slate-700 bg-slate-800 flex items-center justify-between`}>
                                        <div className="flex items-center">
                                            <span className="text-2xl mr-3">{agent.icon}</span>
                                            <span className="font-semibold">{agent.name}</span>
                                        </div>
                                        <div className="text-xs font-mono px-2 py-1 rounded bg-slate-900">
                                            {nodeState.toUpperCase()}
                                        </div>
                                    </div>
                                    {i < agents.length - 1 && (
                                        <div className="h-6 w-0.5 bg-slate-600 mx-auto my-1"></div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const EventStream = ({ events }) => {
            return (
                <div className="glass-panel rounded-xl p-6 h-full flex flex-col">
                    <h2 className="text-xl font-bold mb-4 flex items-center">
                        <span className="text-green-400 mr-2">⚡</span> Live Event Stream
                    </h2>
                    <div className="flex-1 overflow-y-auto pr-2 space-y-3">
                        {events.length === 0 ? (
                            <div className="text-slate-500 text-center mt-10">Waiting for orchestration events...</div>
                        ) : events.map((ev, i) => (
                            <div key={i} className="p-3 rounded border border-slate-700 bg-slate-800/50 text-sm">
                                <div className="flex justify-between text-xs text-slate-400 mb-1">
                                    <span>{new Date().toLocaleTimeString()}</span>
                                    <span className="font-mono text-blue-400">{ev.type}</span>
                                </div>
                                {ev.type === 'agent_trace' ? (
                                    <div>
                                        <div className="font-semibold text-white">{ev.data.agent_name}</div>
                                        <div className="text-slate-300">{ev.data.output_summary}</div>
                                        <div className="mt-2 text-xs flex justify-between">
                                            <span className="text-yellow-400">⏱ {ev.data.duration_ms}ms</span>
                                            <span className="text-emerald-400">✓ {(ev.data.confidence * 100).toFixed(0)}% Conf</span>
                                        </div>
                                    </div>
                                ) : (
                                    <div>
                                        <div className="font-semibold text-white">Workflow State Update</div>
                                        <div className="text-slate-300">Status: <span className="font-mono">{ev.data.status}</span></div>
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const MetricsPanel = () => {
            const [metrics, setMetrics] = useState(null);
            
            useEffect(() => {
                const fetchMetrics = () => {
                    fetch('/api/v1/admin/metrics')
                        .then(r => r.json())
                        .then(setMetrics)
                        .catch(console.error);
                };
                fetchMetrics();
                const interval = setInterval(fetchMetrics, 2000);
                return () => clearInterval(interval);
            }, []);

            return (
                <div className="glass-panel rounded-xl p-6 h-full">
                    <h2 className="text-xl font-bold mb-4 flex items-center">
                        <span className="text-purple-400 mr-2">📈</span> System Analytics
                    </h2>
                    {metrics ? (
                        <div className="grid grid-cols-2 gap-4">
                            <div className="p-4 rounded border border-slate-700 bg-slate-800 text-center">
                                <div className="text-3xl font-bold text-white">{metrics.workflows.total}</div>
                                <div className="text-xs text-slate-400 uppercase tracking-wider mt-1">Total Workflows</div>
                            </div>
                            <div className="p-4 rounded border border-slate-700 bg-slate-800 text-center">
                                <div className="text-3xl font-bold text-emerald-400">{metrics.workflows.completed}</div>
                                <div className="text-xs text-slate-400 uppercase tracking-wider mt-1">Completed</div>
                            </div>
                            <div className="p-4 rounded border border-slate-700 bg-slate-800 text-center">
                                <div className="text-3xl font-bold text-blue-400">{metrics.workflows.active}</div>
                                <div className="text-xs text-slate-400 uppercase tracking-wider mt-1">Active</div>
                            </div>
                            <div className="p-4 rounded border border-slate-700 bg-slate-800 text-center">
                                <div className="text-3xl font-bold text-red-400">{metrics.workflows.failed}</div>
                                <div className="text-xs text-slate-400 uppercase tracking-wider mt-1">Failed</div>
                            </div>
                        </div>
                    ) : (
                        <div className="text-slate-500">Loading metrics...</div>
                    )}
                </div>
            );
        };

        const DemoControls = () => {
            const [demoMode, setDemoMode] = useState(true);
            const [presMode, setPresMode] = useState(false);
            
            const toggleDemo = () => {
                fetch('/api/v1/admin/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ demo_mode: !demoMode, presentation_mode: presMode })
                }).then(() => setDemoMode(!demoMode));
            };

            const togglePres = () => {
                fetch('/api/v1/admin/config', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ demo_mode: demoMode, presentation_mode: !presMode })
                }).then(() => setPresMode(!presMode));
            };

            return (
                <div className="glass-panel rounded-xl p-6 mt-6 flex justify-between items-center">
                    <div>
                        <h2 className="text-lg font-bold">Demo Controls</h2>
                        <p className="text-sm text-slate-400">Toggle deterministic behavior and animation speeds.</p>
                    </div>
                    <div className="flex space-x-4">
                        <button 
                            onClick={toggleDemo}
                            className={`px-4 py-2 rounded font-semibold transition ${demoMode ? 'bg-blue-600 hover:bg-blue-500 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}`}
                        >
                            {demoMode ? 'Demo Mode: ON' : 'Demo Mode: OFF'}
                        </button>
                        <button 
                            onClick={togglePres}
                            className={`px-4 py-2 rounded font-semibold transition ${presMode ? 'bg-purple-600 hover:bg-purple-500 text-white' : 'bg-slate-700 hover:bg-slate-600 text-slate-300'}`}
                        >
                            {presMode ? 'Cinematic Presentation: ON' : 'Cinematic Presentation: OFF'}
                        </button>
                    </div>
                </div>
            );
        };

        const App = () => {
            // Subscribe to all workflows via a special "admin" channel or just wildcard
            const { events, wsStatus } = useWebSocket(`ws://${window.location.host}/ws/orchestration/admin_monitor`);

            return (
                <div className="min-h-screen p-6 flex flex-col">
                    <header className="mb-6 flex justify-between items-end">
                        <div>
                            <h1 className="text-3xl font-extrabold tracking-tight text-white flex items-center">
                                ServiceSathi AI <span className="ml-3 px-2 py-1 bg-blue-500/20 text-blue-400 text-xs rounded border border-blue-500/30">Operations Center</span>
                            </h1>
                        </div>
                        <div className="flex items-center text-sm">
                            <span className={`w-2 h-2 rounded-full mr-2 ${wsStatus === 'Connected' ? 'bg-green-500' : 'bg-red-500'}`}></span>
                            {wsStatus}
                        </div>
                    </header>

                    <div className="flex-1 grid grid-cols-12 gap-6 h-[70vh]">
                        {/* Left: Graph */}
                        <div className="col-span-4 h-full">
                            <NodeGraph events={events} />
                        </div>
                        
                        {/* Center: Live Stream */}
                        <div className="col-span-4 h-full">
                            <EventStream events={events} />
                        </div>
                        
                        {/* Right: Metrics */}
                        <div className="col-span-4 h-full flex flex-col space-y-6">
                            <MetricsPanel />
                        </div>
                    </div>

                    <DemoControls />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
